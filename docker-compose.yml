# A one-command way to run the whole system against a real Postgres without the .NET SDK:
# the generator API, the notification service, and the operator console on
# http://localhost:8090.
#
# The credentials below are deliberately weak and deliberately committed: this file exists
# for local evaluation and nothing else. It is allowlisted in .gitleaks.toml for exactly
# that reason. Never point it at anything that matters.
#
# For development with the SDK, prefer the AppHost — it wires the same topology and gives
# you the dashboard:  dotnet run --project src/ParcelNumberGenerator.AppHost

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parcelnumbers
      POSTGRES_USER: parcelnumbers
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelnumbers"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the second database on first boot — one instance, one database per service.
      - ./scripts/compose-init-db.sql:/docker-entrypoint-initdb.d/10-notifications.sql:ro

  api:
    build:
      context: .
      dockerfile: src/ParcelNumberGenerator.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development, so the startup guard's production requirements do not apply — this
      # compose file has no identity provider to point at.
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_PROVIDER: PostgreSQL
      ConnectionStrings__parcelnumbersdb: "Host=db;Database=parcelnumbers;Username=parcelnumbers;Password=local-development-only"
      Pool__From: "1"
      Pool__To: "9999999"
    ports:
      - "8080:8080"

  notifications:
    build:
      context: .
      dockerfile: src/ParcelNumberGenerator.Notifications/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_PROVIDER: PostgreSQL
      ConnectionStrings__notificationsdb: "Host=db;Database=notifications;Username=parcelnumbers;Password=local-development-only"
    ports:
      - "8081:8080"

  web:
    build:
      context: .
      dockerfile: src/ParcelNumberGenerator.Web/Dockerfile
    depends_on:
      - api
      - notifications
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # The proxy's candidate ladder, rung 1: explicit addresses (FRONTEND-BFF §5).
      Services__Generator__BaseUrl: "http://api:8080"
      Services__Notifications__BaseUrl: "http://notifications:8080"
    ports:
      - "8090:8080"

volumes:
  pgdata:
