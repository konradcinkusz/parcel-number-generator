name: Secret scan

# P5 makes this mandatory, and is blunt about why it is a job rather than a review habit:
# "a repository without one is assumed to contain credentials until proven otherwise".
#
# This repository's own history is the argument. The code this replaced hardcoded a SQL
# Server connection string in five files, and nothing in the pipeline would have noticed if
# it had carried a password rather than integrated auth.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Weekly, so a vulnerability disclosed after a quiet period is still found.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret removed in the tip commit is still a leaked secret, and
          # scanning only the working tree would call that clean.
          fetch-depth: 0

      - name: Scan history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --redact \
            --no-banner \
            --verbose

  # There is no CodeQL job in this repository, and its absence is deliberate rather than
  # an oversight.
  #
  # REPO-BASELINE §1 asks for CodeQL/SAST in CI. This repository is private, so code
  # scanning requires GitHub Advanced Security; without it the analysis runs to
  # completion and is then rejected at upload with "Code scanning is not enabled for
  # this repository". No workflow change fixes that — it is an account setting. The
  # previous codeql.yml here was permanently red on every push and pull request for
  # exactly that reason, while the README carried a badge claiming the scan passed.
  #
  # The job was removed rather than left failing or wrapped in continue-on-error. A
  # security gate that is present, permanently red and unable to report is the
  # committed-but-never-executed pattern the standards name: it makes the repository
  # look like it has a SAST gate while providing none, and it trains everyone to ignore
  # a red check. An absent job with a written reason is more honest than a decorative one.
  #
  # Tracked in docs/architecture/DEVIATIONS.md. To restore it: enable GitHub Advanced
  # Security, or make the repository public (code scanning is free there, but
  # OPEN-SOURCE-RELEASE.md's history audit comes first), then add
  # github/codeql-action/init with languages: csharp, a build step, and analyze, with
  # permissions actions: read, contents: read, security-events: write.

  dependency-audit:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ParcelNumberGenerator.slnx

      - name: Fail on a known-vulnerable package
        # Transitive included: the dependency that bites is rarely the one named in a
        # .csproj. NuGetAudit gates the build on push; the weekly schedule below is what
        # catches an advisory disclosed while nobody was pushing.
        run: |
          set -euo pipefail
          report=$(dotnet list ParcelNumberGenerator.slnx package --vulnerable --include-transitive)
          echo "$report"
          if echo "$report" | grep -qi 'has the following vulnerable packages'; then
            echo "::error::Vulnerable packages found. Bump them in Directory.Packages.props."
            exit 1
          fi
