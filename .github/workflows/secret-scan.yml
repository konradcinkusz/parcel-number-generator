name: Secret scan

# P5 makes this mandatory, and is blunt about why it is a job rather than a review habit:
# "a repository without one is assumed to contain credentials until proven otherwise".
#
# This repository's own history is the argument. The code this replaced hardcoded a SQL
# Server connection string in five files, and nothing in the pipeline would have noticed if
# it had carried a password rather than integrated auth.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in the tip commit is still a leaked secret, and
          # scanning only the working tree would call that clean.
          fetch-depth: 0

      - name: Scan history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --redact \
            --no-banner \
            --verbose
