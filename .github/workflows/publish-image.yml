name: Publish images

# Tag-driven (P12). GHCR rather than a platform-specific registry, so the same digest can be
# pulled by Fly, by a customer's own cluster, or by a developer, without a rebuild.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and push (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # One broken image must not cancel the others mid-push, or the registry is left
      # holding a partial set and the next deploy mixes versions.
      fail-fast: false
      matrix:
        include:
          - name: parcelnumbers-api
            dockerfile: src/ParcelNumberGenerator.Api/Dockerfile
          - name: notifications
            dockerfile: src/ParcelNumberGenerator.Notifications/Dockerfile
          - name: web
            dockerfile: src/ParcelNumberGenerator.Web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Cross-compiled rather than emulated — each Dockerfile pins its SDK stage to the
          # build platform and passes TARGETARCH to `dotnet publish -a`.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
