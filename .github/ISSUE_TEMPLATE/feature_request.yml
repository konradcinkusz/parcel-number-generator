name: Feature request
description: Something the service should be able to do.
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do that the service makes hard or impossible.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: >-
        Optional. If this is a new way of choosing numbers, note that a strategy is one class
        implementing `IAllocationStrategy` plus one registration line — see
        `docs/architecture/03-TARGET-ARCHITECTURE.md`.
    validations:
      required: false
